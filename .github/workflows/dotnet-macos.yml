name: Build the Engine (macOS)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'engine/**'
      - 'global.json'
      - '.github/workflows/dotnet-macos.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'engine/**'
      - 'global.json'
      - '.github/workflows/dotnet-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-engine-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 6.0.x
    - name: Confirm inherited SDK baseline
      run: dotnet --version
    - name: Install inherited MAUI workload
      run: dotnet workload install maui --skip-manifest-update
    - name: Restore engine dependencies
      run: dotnet restore engine/Orbit.Engine/Orbit.Engine.csproj
    - name: Restore test dependencies
      run: dotnet restore engine/Orbit.Engine.Tests/Orbit.Engine.Tests.csproj
    - name: Build engine
      run: dotnet build engine/Orbit.Engine/Orbit.Engine.csproj --no-restore
    - name: Build tests
      run: dotnet build engine/Orbit.Engine.Tests/Orbit.Engine.Tests.csproj --no-restore
    - name: Run tests
      run: dotnet test engine/Orbit.Engine.Tests/Orbit.Engine.Tests.csproj --no-restore
    - name: Pack engine
      run: dotnet pack engine/Orbit.Engine/Orbit.Engine.csproj --no-restore
