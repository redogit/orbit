name: Build the Engine (Windows)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'engine/**'
      - 'global.json'
      - '.github/workflows/dotnet-windows.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'engine/**'
      - 'global.json'
      - '.github/workflows/dotnet-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-engine-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 6.0.x
    - name: Install Android API 31 with runner Java
      shell: pwsh
      run: |
        java -version
        & "$env:ANDROID_SDK_ROOT\cmdline-tools\latest\bin\sdkmanager.bat" "platforms;android-31"
        if (-not (Test-Path "$env:ANDROID_SDK_ROOT\platforms\android-31\android.jar")) { throw "Android API 31 was not installed" }
    - name: Setup inherited Java baseline
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '11'
    - name: Confirm inherited build baselines
      shell: pwsh
      run: |
        dotnet --version
        java -version
    - name: Install latest compatible .NET 6 MAUI workload
      run: dotnet workload install maui
    - name: Restore engine dependencies
      run: dotnet restore engine/Orbit.Engine/Orbit.Engine.csproj
    - name: Restore test dependencies
      run: dotnet restore engine/Orbit.Engine.Tests/Orbit.Engine.Tests.csproj
    - name: Build engine
      run: dotnet build engine/Orbit.Engine/Orbit.Engine.csproj --no-restore
    - name: Build tests
      run: dotnet build engine/Orbit.Engine.Tests/Orbit.Engine.Tests.csproj --no-restore
    - name: Run tests
      run: dotnet test engine/Orbit.Engine.Tests/Orbit.Engine.Tests.csproj --no-restore
    - name: Pack engine
      run: dotnet pack engine/Orbit.Engine/Orbit.Engine.csproj --no-restore
